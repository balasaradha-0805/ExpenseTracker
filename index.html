<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Expense Tracker</h1>
        <p>Track your income and Expenses</p>
    </header>
 <main>
    <section class="summary">
        <div class="summary-card">
            <h3>Balance</h3>
            <p id="balance">Rs 0</p>
        </div>

        <div class="summary-card">
            <h3>Income</h3>
            <p id="income">Rs 0</p>
        </div>
        <div class="summary-card">
            <h3>Expenses</h3>
            <p id="expense">Rs 0</p>
        </div>
    </section>


    <section class="form-section">
        <h2>Add Transaction</h2>
        <form id="transaction-form">
            <div>
                <label for="title">Description</label>
                <input type="text" id="title" placeholder=" Cause of Transaction">
            </div>
            <div>
                <label for="amount">Amount</label>
                <input type="number" id="amount" placeholder="Eg: 500">
            </div>

            <div>
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="abc@gmail.com">
                <button onclick=validateEmail()>Validate Email</button>
            </div>


            <div>
                <label for="category">Category</label>
                <select  id="category">
                    <option value="Food"> Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Bills">Bills</option>
                    <option value="Others">Others</option>
                </select>
            </div>

            <div>
                <label >Type</label>
                <label ><input type="radio" name="type" value="income">Income</label>
                <label ><input type="radio" name="type" id="" value="expense" checked> Expense</label>
            </div>

            <button type="submit" class="sub-btn"> Add Transaction</button>
        </form>
    </section>

    <section class="transactions">
        <h2>Transactions</h2>
        <input type="text" name="" id="search" placeholder="search Transaction ....">
        <div id="transaction-list">
            <!--js will add transaction here -->
        </div>
    </section>

    <section class="api">
        <button class="api-btn" onclick=apicall()>click api </button>
        <div class="api-text">
            
        </div>
    </section>
 </main>
    <script src = "script.js">
  
    </script>

</body>
</html>
